---

- name: "create auto-login wallet to delete"
  oracle_orapki:
    oracle_home: "{{ oracle_home }}"
    state: present
    wallet_location: "{{ wallet_location }}_delete"
    wallet_password: "{{ wallet_password }}"
    auto_login: auto_login
  register: _
  failed_when: not _.changed

- name: "delete auto-login wallet"
  oracle_orapki:
    oracle_home: "{{ oracle_home }}"
    state: absent
    wallet_location: "{{ wallet_location }}_delete"
    wallet_password: "{{ wallet_password }}"
  register: _
  failed_when: not _.changed

- name: "delete auto-login wallet (idempotent: ewallet.p12 and cwallet.sso both removed)"
  oracle_orapki:
    oracle_home: "{{ oracle_home }}"
    state: absent
    wallet_location: "{{ wallet_location }}_delete"
    wallet_password: "{{ wallet_password }}"
  register: _
  failed_when: _.changed

- name: "remove auto-login wallet directory"
  file:
    path: "{{ wallet_location }}_delete"
    state: absent

...
